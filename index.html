<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d5be3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Biudžetas</title>
<style>
:root{--bg:#f5f3ef;--sf:#fff;--bd:#e2ddd6;--tx:#1a1816;--mu:#7a736b;--gr:#1a6b47;--grb:#e8f5ee;--rd:#b83030;--rdb:#fceaea;--ac:#2d5be3}
@media(prefers-color-scheme:dark){:root{--bg:#151515;--sf:#1f1f1f;--bd:#333;--tx:#eee;--mu:#9a9a9a;--gr:#4cc38a;--grb:#16301f;--rd:#f07575;--rdb:#3a1d1d;--ac:#6b8cff}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding-bottom:84px}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mn{display:flex;align-items:center;gap:6px;margin:0 auto}
.mn button{width:38px;height:38px;border:1px solid var(--bd);background:var(--sf);border-radius:9px;font-size:20px;color:var(--mu)}
.ml{font-weight:600;min-width:130px;text-align:center}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.m{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px}
.ml2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:4px}
.mv{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.g{color:var(--gr)}.r{color:var(--rd)}
.daily{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.daily small{color:var(--mu);font-size:12px;display:block;margin-top:2px}
.dv{font-size:22px;font-weight:700}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;font-size:16px;color:var(--tx);background:var(--bg);outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--ac)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.btn:active{opacity:.85}
.msg{padding:9px 12px;border-radius:9px;margin-bottom:10px;font-size:14px;background:var(--grb);color:var(--gr)}
.msg.e{background:var(--rdb);color:var(--rd)}
.tx{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:11px;margin-bottom:6px;gap:8px}
.tx .d{font-weight:600;font-size:14px;word-break:break-word}
.tx .mt{font-size:12px;color:var(--mu);margin-top:2px}
.tx .rt{display:flex;align-items:center;gap:8px;white-space:nowrap}
.x{min-width:40px;height:36px;border:1px solid var(--bd);background:transparent;border-radius:8px;color:var(--mu);font-size:14px}
.x.c{background:var(--rd);border-color:var(--rd);color:#fff}
.sl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin-bottom:10px}
.cr{padding:8px 0;border-bottom:1px solid var(--bd)}
.cr:last-child{border:none}
.cr .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bs{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.chart .b{width:45%;border-radius:4px 4px 0 0;min-height:2px}
.chart .lb{font-size:11px;color:var(--mu);margin-top:5px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:10px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.empty{text-align:center;color:var(--mu);padding:26px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 2px 10px;border:none;background:transparent;color:var(--mu);font-size:12px;font-weight:600}
nav button span{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--ac)}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mn">
      <button onclick="chM(-1)" aria-label="Ankstesnis">‹</button>
      <div class="ml" id="ml"></div>
      <button onclick="chM(1)" aria-label="Kitas">›</button>
    </div>
  </header>

  <div class="metrics">
    <div class="m"><div class="ml2">Pajamos</div><div class="mv g" id="mi"></div></div>
    <div class="m"><div class="ml2">Išlaidos</div><div class="mv r" id="me"></div></div>
    <div class="m"><div class="ml2">Lieka</div><div class="mv" id="mb"></div></div>
  </div>
  <div class="daily"><div><div class="ml2" style="margin:0">Galima per dieną</div><small id="ds"></small></div><div class="dv" id="dv"></div></div>

  <section id="v-add">
    <div class="card">
      <div id="msg" class="hide"></div>
      <div class="row">
        <div><label>Tipas</label><select id="ft" onchange="cats()"><option value="out">Išlaida</option><option value="in">Pajama</option></select></div>
        <div><label>Suma (€)</label><input id="fa" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
      </div>
      <div class="row">
        <div><label>Kategorija</label><select id="fc"></select></div>
        <div><label>Data</label><input id="fd" type="date"></div>
      </div>
      <div style="margin-bottom:12px"><label>Aprašymas</label><input id="fe" type="text" placeholder="pvz. Maxima, kuras"></div>
      <button class="btn" onclick="add()">Įrašyti</button>
    </div>
  </section>

  <section id="v-list" class="hide"><div id="list"></div></section>

  <section id="v-stats" class="hide">
    <div class="card"><div class="sl">Išlaidos pagal kategoriją</div><div id="cats"></div></div>
    <div class="card"><div class="sl">Paskutiniai 6 mėnesiai</div>
      <div class="leg"><span><i style="background:var(--gr)"></i>Pajamos</span><span><i style="background:var(--rd)"></i>Išlaidos</span></div>
      <div class="chart" id="chart"></div></div>
  </section>

  <section id="v-set" class="hide">
    <div class="card">
      <div class="sl">Mėnesio pajamos (pastovios)</div>
      <div class="row" style="grid-template-columns:2fr 1fr;align-items:end">
        <div><label>Suma (€)</label><input id="si" type="number" inputmode="decimal" step="0.01" min="0"></div>
        <button class="btn" onclick="saveInc()">Saugoti</button>
      </div>
    </div>
    <div class="card">
      <div class="sl">Fiksuotos išlaidos (kiekvieną mėnesį)</div>
      <div id="fx"></div>
      <div class="row" style="grid-template-columns:2fr 1fr;margin-top:10px">
        <div><label>Pavadinimas</label><input id="fn" type="text" placeholder="pvz. Paskola"></div>
        <div><label>Suma</label><input id="fv" type="number" inputmode="decimal" step="0.01" min="0"></div>
      </div>
      <button class="btn" onclick="addFx()">Pridėti fiksuotą išlaidą</button>
    </div>
    <div class="card">
      <div class="sl">Atsarginė kopija</div>
      <button class="btn" onclick="exp()">Eksportuoti duomenis</button>
      <button class="btn sec" onclick="document.getElementById('imp').click()">Importuoti duomenis</button>
      <input id="imp" type="file" accept="application/json" class="hide" onchange="imp(this)">
    </div>
  </section>
</div>

<nav>
  <button class="on" onclick="tab('add',this)"><span>＋</span>Įvesti</button>
  <button onclick="tab('list',this)"><span>☰</span>Sąrašas</button>
  <button onclick="tab('stats',this)"><span>▥</span>Statistika</button>
  <button onclick="tab('set',this)"><span>⚙</span>Nustatymai</button>
</nav>

<script>
const OUT=['Maistas','Transportas','Būstas','Komunaliniai','Sveikata','Pramogos','Drabužiai','Vaikas','Kelionės','Kita'];
const INC=['Alga','Konsultacijos','Dividendai','Kita'];
const MON=['Sausis','Vasaris','Kovas','Balandis','Gegužė','Birželis','Liepa','Rugpjūtis','Rugsėjis','Spalis','Lapkritis','Gruodis'];
const KEY='biudzetas_v1';
let D=load(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), pend=null, curTab='add';

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return Object.assign({income:0,fixed:[],tx:[]},d)}catch(e){}return{income:0,fixed:[],tx:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){msg('Nepavyko išsaugoti: '+e.message,true)}}
const fmt=n=>(n<0?'−':'')+'€'+Math.abs(n).toLocaleString('lt-LT',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pre=(y,m)=>y+'-'+pad(m+1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txOf=(y,m)=>D.tx.filter(t=>t.date.startsWith(pre(y,m)));
const fixedTotal=()=>D.fixed.reduce((s,f)=>s+f.amount,0);
function sums(y,m){const t=txOf(y,m);const ei=t.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0);const eo=t.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0);return{inc:D.income+ei,exp:fixedTotal()+eo}}

function msg(t,err){const e=document.getElementById('msg');e.textContent=t;e.className='msg'+(err?' e':'');setTimeout(()=>e.className='hide',2800)}
function cats(){const t=document.getElementById('ft').value;document.getElementById('fc').innerHTML=(t==='out'?OUT:INC).map(c=>`<option>${c}</option>`).join('')}
function chM(d){cm+=d;if(cm>11){cm=0;cy++}if(cm<0){cm=11;cy--}render()}
function tab(n,b){curTab=n;['add','list','stats','set'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hide',x!==n));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}

function add(){
  const a=parseFloat(document.getElementById('fa').value),d=document.getElementById('fd').value;
  if(!a||a<=0||!d){msg('Įveskite sumą ir datą',true);return}
  const c=document.getElementById('fc').value;
  D.tx.push({id:Date.now(),type:document.getElementById('ft').value,amount:a,cat:c,date:d,desc:document.getElementById('fe').value.trim()||c});
  save();document.getElementById('fa').value='';document.getElementById('fe').value='';msg('Įrašyta ✓');
  const dt=new Date(d+'T00:00:00');cy=dt.getFullYear();cm=dt.getMonth();render();
}
function del(id){
  if(pend===id){D.tx=D.tx.filter(t=>t.id!==id);pend=null;save();render()}
  else{pend=id;render();setTimeout(()=>{if(pend===id){pend=null;render()}},2500)}
}
function saveInc(){const v=parseFloat(document.getElementById('si').value);D.income=v>0?v:0;save();render();alert('Pajamos išsaugotos')}
function addFx(){
  const n=document.getElementById('fn').value.trim(),v=parseFloat(document.getElementById('fv').value);
  if(!n||!v||v<=0)return;D.fixed.push({id:Date.now(),name:n,amount:v});
  document.getElementById('fn').value='';document.getElementById('fv').value='';save();render();
}
function delFx(id){
  if(pend===id){D.fixed=D.fixed.filter(f=>f.id!==id);pend=null;save();render()}
  else{pend=id;render();setTimeout(()=>{if(pend===id){pend=null;render()}},2500)}
}
function exp(){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='biudzetas-'+iso(new Date())+'.json';a.click();
}
function imp(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx)||!Array.isArray(d.fixed))throw 0;
    if(confirm('Importas pakeis dabartinius duomenis. Tęsti?')){D=Object.assign({income:0,fixed:[],tx:[]},d);save();render();alert('Importuota')}}
    catch(e){alert('Netinkamas failas')}inp.value=''};
  r.readAsText(f);
}

function render(){
  document.getElementById('ml').textContent=MON[cm]+' '+cy;
  const s=sums(cy,cm),bal=s.inc-s.exp;
  document.getElementById('mi').textContent=fmt(s.inc);
  document.getElementById('me').textContent=fmt(s.exp);
  const mb=document.getElementById('mb');mb.textContent=fmt(bal);mb.className='mv '+(bal>=0?'g':'r');
  const dim=new Date(cy,cm+1,0).getDate(),cur=cy===now.getFullYear()&&cm===now.getMonth();
  const left=cur?dim-now.getDate()+1:dim;
  const dv=document.getElementById('dv');
  if(s.inc>0){const p=bal/left;dv.textContent=fmt(p);dv.className='dv '+(p>=0?'g':'r');document.getElementById('ds').textContent=left+' d. liko mėnesyje'}
  else{dv.textContent='—';dv.className='dv';document.getElementById('ds').textContent='Nustatymuose įveskite pajamas'}

  if(curTab==='list'){
    const t=txOf(cy,cm).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
    document.getElementById('list').innerHTML=t.length?t.map(x=>`<div class="tx"><div><div class="d">${esc(x.desc)}</div><div class="mt">${x.date} · ${esc(x.cat)}</div></div><div class="rt"><b class="${x.type==='in'?'g':'r'}">${x.type==='in'?'+':'−'}${fmt(x.amount).replace('−','')}</b><button class="x ${pend===x.id?'c':''}" onclick="del(${x.id})">${pend===x.id?'Tikrai?':'✕'}</button></div></div>`).join(''):'<div class="empty">Šį mėnesį operacijų nėra</div>';
  }
  if(curTab==='stats'){
    const by={};D.fixed.forEach(f=>by['Fiksuotos: '+f.name]=(by['Fiksuotos: '+f.name]||0)+f.amount);
    txOf(cy,cm).filter(x=>x.type==='out').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
    const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]),tot=arr.reduce((s,x)=>s+x[1],0);
    document.getElementById('cats').innerHTML=arr.length?arr.map(([k,v])=>`<div class="cr"><div class="t"><span>${esc(k)}</span><b>${fmt(v)} · ${Math.round(v/tot*100)}%</b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`).join(''):'<div class="empty">Nėra išlaidų</div>';
    const cols=[];let mx=1;
    for(let i=5;i>=0;i--){let m=cm-i,y=cy;while(m<0){m+=12;y--}const q=sums(y,m);mx=Math.max(mx,q.inc,q.exp);cols.push({l:MON[m].slice(0,3),q})}
    document.getElementById('chart').innerHTML=cols.map(c=>`<div class="col"><div class="bs"><div class="b" style="height:${c.q.inc/mx*100}%;background:var(--gr)"></div><div class="b" style="height:${c.q.exp/mx*100}%;background:var(--rd)"></div></div><div class="lb">${c.l}</div></div>`).join('');
  }
  if(curTab==='set'){
    const si=document.getElementById('si');if(document.activeElement!==si)si.value=D.income||'';
    document.getElementById('fx').innerHTML=D.fixed.length?D.fixed.map(f=>`<div class="tx"><div class="d">${esc(f.name)}</div><div class="rt"><b>${fmt(f.amount)}</b><button class="x ${pend===f.id?'c':''}" onclick="delFx(${f.id})">${pend===f.id?'Tikrai?':'✕'}</button></div></div>`).join('')+`<div style="text-align:right;color:var(--mu);font-size:13px;margin-top:4px">Viso: <b>${fmt(fixedTotal())}</b></div>`:'<div class="empty" style="padding:12px 0">Fiksuotų išlaidų dar nėra</div>';
  }
}

document.getElementById('fd').value=iso(now);
cats();render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
